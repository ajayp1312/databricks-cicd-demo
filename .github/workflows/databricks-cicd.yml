name: Databricks beginner CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      run_notebook:
        description: "Run notebook after deployment? Uses compute."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ci:
    name: Check Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile notebook source
        run: python3 -m compileall -q src

  deploy:
    name: Validate and deploy to Databricks
    needs: ci

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    concurrency:
      group: databricks-beginner-sales-dev
      cancel-in-progress: false

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check authenticated user
        run: databricks current-user me

      - name: Validate bundle
        run: databricks bundle validate -t dev

      - name: Deploy notebook and job configuration
        run: databricks bundle deploy -t dev

      - name: Show deployment details
        run: databricks bundle summary -t dev

      - name: Run notebook and integration assertions
        if: github.event_name == 'workflow_dispatch' && inputs.run_notebook
        run: databricks bundle run -t dev sales_job